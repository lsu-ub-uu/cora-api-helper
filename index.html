<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cora API Helper</title>
    <link rel="stylesheet" href="/api-helper/styles/global.css" />
  </head>
  <body>
    <header>
      <a href="/api-helper" class="logo-link"><h1>Cora API Helper</h1></a>
      <form id="load-form">
        <label>
          Format
          <select id="format" name="format">
            <option value="xml">XML</option>
            <option value="json">JSON</option>
          </select>
        </label>

        <label>
          Language
          <select id="lang" name="lang">
            <option value="en">English</option>
            <option value="sv">Swedish</option>
          </select>
        </label>
      </form>
    </header>

    <div id="app"></div>
    <script type="module" src="/api-helper/app/main.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const apiUrlFromParams = params.get("api-url");
      if (window.location.hostname === "localhost" && !params.get("api-url")) {
        params.set("api-url", `https://preview.diva.cora.epc.ub.uu.se/rest`);
        window.history.replaceState(
          {},
          "",
          `${window.location.pathname}?${params.toString()}`,
        );
      }
      const apiUrl = params.get("api-url") ?? `${window.location.origin}/rest`;
      const format = params.get("format") ?? "xml";
      const lang = params.get("lang") ?? "en";
      console.log("API URL:", apiUrl);
      console.log("Format:", format);
      console.log("Language:", lang);

      if (format) {
        document.getElementById("format").value = format;
      }
      if (lang) {
        document.getElementById("lang").value = lang;
      }

      document
        .getElementById("load-form")
        .addEventListener("change", (event) => {
          event.currentTarget.submit();
        });
    </script>
  </body>
</html>
